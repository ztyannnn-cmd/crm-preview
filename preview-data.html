<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>SOLBRIDGE · 测试数据</title>
 <link rel="stylesheet" href="./design-system/tokens.css">
 <style>
  *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f8fafc}
  #crm-preview{min-height:100vh;padding:32px 24px;color:var(--ink);font:var(--type-body)}
  main{max-width:760px;margin:auto}header{font-weight:700;margin-bottom:24px}h1{font:var(--type-page);margin:0 0 12px}h2{font:var(--type-section)}
  section{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-panel);padding:24px;margin-bottom:20px}
  p{color:var(--dim)}ul{display:grid;grid-template-columns:repeat(3,1fr);list-style:none;padding:0;gap:12px;margin:24px 0}
  button,a,select{font:inherit}button,a.button{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius-control);padding:9px 14px;background:white;color:var(--ink);text-decoration:none;cursor:pointer}
  button.primary,a.primary{background:var(--brand);border-color:var(--brand);color:white}button:disabled{opacity:.5;cursor:default}
  select{max-width:100%;padding:9px;border:1px solid var(--line);border-radius:var(--radius-control)}.actions{display:flex;flex-wrap:wrap;gap:12px}
  #message{margin:20px 0;line-height:1.7}#message[data-state=success]{color:#166534}#message[data-state=error]{color:#b91c1c}
  a{color:var(--brand)}@media(max-width:500px){ul{grid-template-columns:repeat(2,1fr)}section{padding:18px}}
 </style>
</head>
<body>
 <div id="crm-preview" class="ds-projects"><main>
  <header>SOLBRIDGE</header>
  <section>
   <h1>测试数据</h1>
   <p>清空当前浏览器的达人、项目、提报、订单、视频、草稿及跟进记录。保留测试账号，清空前自动备份，可在下方恢复。</p>
   <ul id="counts" aria-label="当前数据条数"></ul>
   <div class="actions"><button id="clear-data">备份并清空测试数据</button><a class="button primary" href="./#followup">开始测试</a></div>
   <div id="message" role="status" aria-live="polite"></div>
  </section>
  <section>
   <h2>恢复备份</h2>
   <p>备份只保存在当前浏览器。恢复前也会自动保存当前数据。</p>
   <div class="actions"><select id="backups" aria-label="选择备份"></select><button id="restore-data" disabled>恢复所选备份</button></div>
  </section>
  <p>普通入口中的新测试记录会保留。<a href="./?demo=followup">独立演示入口</a>仍提供可重置的模拟样例。</p>
 </main></div>
 <script type="module" src="./preview-data-tools.mjs"></script>
</body>
</html>
